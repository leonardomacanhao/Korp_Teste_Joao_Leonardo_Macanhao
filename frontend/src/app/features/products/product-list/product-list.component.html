<div class="pl-page">
  
  <!-- Cabeçalho -->
  <div class="pl-header">
    <div class="pl-header__left">
      <div class="pl-header__icon">
        <mat-icon>inventory_2</mat-icon>
      </div>
      <div class="pl-header__text">
        <h1 class="pl-header__title">Cadastro de Produtos</h1>
        <p class="pl-header__subtitle">Gerencie o estoque e informações dos produtos</p>
      </div>
    </div>

    <button class="pl-btn pl-btn--primary" routerLink="/products/new">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Novo Produto
    </button>
  </div>

  <!-- Mensagem de erro -->
  <div *ngIf="error" class="pl-error">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="pl-error__icon">
      <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 4v5M8 12h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span>{{ error }}</span>
    <button class="pl-btn pl-btn--ghost pl-error__retry" (click)="loadProducts()">Tentar novamente</button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="pl-loading">
    <div class="pl-loading__track"><div class="pl-loading__fill"></div></div>
    <span class="pl-loading__label">Carregando produtos...</span>
  </div>

  <!-- Tabela -->
  <div class="pl-card" *ngIf="!loading">
    <div *ngIf="dataSource.data.length > 0" class="pl-table-wrapper">
      <table mat-table [dataSource]="dataSource" class="pl-table">

        <!-- Código -->
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef> Código </th>
          <td mat-cell *matCellDef="let product"> <span class="pl-code">{{ product.code }}</span> </td>
        </ng-container>

        <!-- Descrição -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let product"> {{ product.description }} </td>
        </ng-container>

        <!-- Saldo -->
        <ng-container matColumnDef="stockBalance">
          <th mat-header-cell *matHeaderCellDef> Saldo </th>
          <td mat-cell *matCellDef="let product"> 
            <span class="pl-stock" [class.pl-stock--low]="product.stockBalance < 10">
              {{ product.stockBalance }} un.
            </span>
          </td>
        </ng-container>

<!-- Ações -->
<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef> Ações </th>
  <td mat-cell *matCellDef="let product">
    
    <!-- Grupo de ações com espaçamento adequado -->
    <div class="pl-actions">
      
      <!-- Botão Editar: Ícone de Lápis (estilo Flaticon) -->
      <button class="pl-action-btn pl-action-btn--edit" 
              [routerLink]="['/products/edit', product.id]" 
              title="Editar produto">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 4H4C3.46957 4 2.96086 4.21071 2.58579 4.58579C2.21071 4.96086 2 5.46957 2 6V20C2 20.5304 2.21071 21.0391 2.58579 21.4142C2.96086 21.7893 3.46957 22 4 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V13" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18.5 2.50001C18.8978 2.10219 19.4374 1.87869 20 1.87869C20.5626 1.87869 21.1022 2.10219 21.5 2.50001C21.8978 2.89784 22.1213 3.4374 22.1213 4.00001C22.1213 4.56262 21.8978 5.10219 21.5 5.50001L12 15L8 16L9 12L18.5 2.50001Z" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <!-- Botão Excluir: Ícone de Lixeira (estilo Flaticon) -->
      <button class="pl-action-btn pl-action-btn--delete" 
              (click)="confirmDelete(product)" 
              [disabled]="isProdutoInativo(product.code)" 
              title="Excluir produto">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6" 
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
    </div>
  </td>
</ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Estado vazio -->
    <div *ngIf="dataSource.data.length === 0" class="pl-empty">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" class="pl-empty__icon">
        <rect x="8" y="12" width="32" height="28" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M16 20h16M16 26h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="pl-empty__text">Nenhum produto ativo cadastrado.</p>
      <button class="pl-btn pl-btn--primary" routerLink="/products/new">Cadastrar primeiro produto</button>
    </div>
  </div>
</div>
