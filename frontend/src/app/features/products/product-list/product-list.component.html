<div class="korp-products-page">
  <main>
    <div class="container">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-head-left">
            <div class="panel-icon">
              <mat-icon>inventory_2</mat-icon>
            </div>
            <div>
              <h1>Cadastro de Produtos</h1>
              <p>Gerencie o estoque e informações dos produtos</p>
            </div>
          </div>

          <button class="btn-primary" type="button" (click)="goToCreate()">
            <mat-icon>add</mat-icon>
            Novo Produto
          </button>
        </div>

        <div *ngIf="error" class="empty-state" role="alert">
          <mat-icon>error_outline</mat-icon>
          <div class="state-message">{{ error }}</div>
          <div class="state-action">
            <button class="btn-primary" (click)="loadProducts()">Tentar novamente</button>
          </div>
        </div>

        <div *ngIf="loading" class="empty-state">
          <mat-icon>hourglass_top</mat-icon>
          <div class="state-message">Carregando produtos...</div>
        </div>

        <div class="table-wrap" *ngIf="!loading && dataSource.data.length > 0">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Saldo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let product of dataSource.data">
                <td><span class="code-badge">{{ product.code }}</span></td>
                <td class="desc-cell">{{ product.description }}</td>
                <td>
                  <span class="qty" [class.low]="product.stockBalance < 10" [class.ok]="product.stockBalance >= 10">
                    {{ product.stockBalance }} un.
                  </span>
                </td>
                <td>
                  <div class="actions">
                    <button class="icon-btn" [routerLink]="['/products/edit', product.id]" title="Editar">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button class="icon-btn danger" (click)="confirmDelete(product)" [disabled]="product.isActive === false" title="Excluir">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div *ngIf="!loading && !error && dataSource.data.length === 0" class="empty-state">
          <mat-icon>inventory_2</mat-icon>
          <p class="state-action">Nenhum produto ativo cadastrado.</p>
          <div class="state-action--spacious">
            <button class="btn-primary" type="button" (click)="goToCreate()">Cadastrar primeiro produto</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
