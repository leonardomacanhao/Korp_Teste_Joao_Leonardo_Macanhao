<div class="container">
  <!-- Cabeçalho da página -->
  <div class="header">
    <h1>📦 Cadastro de Produtos</h1>
    <button mat-raised-button color="primary" (click)="goToCreate()">
      <mat-icon>add</mat-icon>
      Novo Produto
    </button>
  </div>

  <!-- Mensagem de erro (aparece só se houver erro) -->
  <div *ngIf="error" class="error-banner">
    <mat-icon color="warn">error</mat-icon>
    <span>{{ error }}</span>
    <button mat-button color="warn" (click)="loadProducts()">Tentar novamente</button>
  </div>

  <!-- Indicador de carregamento (aparece só se loading = true) -->
  <div *ngIf="loading" class="loading">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <p>Carregando produtos...</p>
  </div>

  <!-- Tabela de produtos (aparece só se NÃO estiver carregando e tiver dados) -->
  <div *ngIf="!loading && dataSource.data.length > 0" class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Coluna: Código -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let product"> {{ product.code }} </td>
      </ng-container>

      <!-- Coluna: Descrição -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let product"> {{ product.description }} </td>
      </ng-container>

      <!-- Coluna: Saldo em Estoque -->
      <ng-container matColumnDef="stockBalance">
        <th mat-header-cell *matHeaderCellDef> Saldo </th>
        <td mat-cell *matCellDef="let product">
          <span [class.low-stock]="product.stockBalance < 5">
            {{ product.stockBalance }} un.
          </span>
        </td>
      </ng-container>

      <!-- Coluna: Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary" (click)="editProduct(product)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Mensagem quando não há produtos -->
  <div *ngIf="!loading && dataSource.data.length === 0 && !error" class="empty-state">
    <mat-icon>inventory_2</mat-icon>
    <p>Nenhum produto cadastrado ainda.</p>
    <button mat-button color="primary" (click)="goToCreate()">Cadastrar primeiro produto</button>
  </div>
</div>
