<div class="container">
  <!-- Cabeçalho -->
  <div class="header">
    <h1>📦 Cadastro de Produtos</h1>
    <button mat-raised-button color="primary" routerLink="/products/new">
      <mat-icon>add</mat-icon>
      Novo Produto
    </button>
  </div>

  <!-- Mensagem de erro -->
  <div *ngIf="error" class="error-banner">
    <mat-icon color="warn">error</mat-icon>
    <span>{{ error }}</span>
    <button mat-button color="warn" (click)="loadProducts()">Tentar novamente</button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <p>Carregando produtos...</p>
  </div>

  <!-- Tabela -->
  <div *ngIf="!loading && dataSource.data.length > 0" class="table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Código -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let product"> {{ product.code }} </td>
      </ng-container>

      <!-- Descrição -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let product"> {{ product.description }} </td>
      </ng-container>

      <!-- Saldo -->
      <ng-container matColumnDef="stockBalance">
        <th mat-header-cell *matHeaderCellDef> Saldo </th>
        <td mat-cell *matCellDef="let product"> {{ product.stockBalance }} un. </td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let product">
          
          <!-- Botão Editar -->
          <button mat-icon-button color="primary" 
                  [routerLink]="['/products/edit', product.id]" 
                  matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          
          <!-- Botão Excluir (CORRIGIDO: usa helper method) -->
          <button mat-icon-button color="warn" 
                  (click)="confirmDelete(product)" 
                  [disabled]="isProdutoInativo(product.code)" 
                  matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
          
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Estado vazio -->
  <div *ngIf="!loading && dataSource.data.length === 0 && !error" class="empty-state">
    <mat-icon>inventory_2</mat-icon>
    <p>Nenhum produto ativo cadastrado.</p>
    <button mat-button color="primary" routerLink="/products/new">Cadastrar primeiro produto</button>
  </div>
</div>
