<div class="il-page">
  
  <!-- Cabeçalho da Página -->
  <div class="il-header">
    <div class="il-header__left">
      <div class="il-header__icon">
        <mat-icon>receipt_long</mat-icon>
      </div>
      <div class="il-header__text">
        <h1 class="il-header__title">Notas Fiscais</h1>
        <p class="il-header__subtitle">Crie e acompanhe o status das emissões</p>
      </div>
    </div>

    <!-- Botão Nova NF - Estilo Fluent -->
    <button class="il-btn il-btn--primary" routerLink="/invoices/new">
      <mat-icon>add</mat-icon>
      Nova NF
    </button>
  </div>

  <!-- Card de Conteúdo -->
  <div class="il-card">
    
    <!-- Loading -->
    <div *ngIf="loading" class="il-loading">
      <div class="il-loading__track"><div class="il-loading__fill"></div></div>
      <span class="il-loading__label">Carregando notas fiscais...</span>
    </div>

    <!-- Tabela de Notas -->
    <div class="il-table-wrapper" *ngIf="!loading">
      <table mat-table [dataSource]="dataSource" class="il-table">
        
        <!-- Número -->
        <ng-container matColumnDef="number">
          <th mat-header-cell *matHeaderCellDef> Número </th>
          <td mat-cell *matCellDef="let inv"> 
            <span class="il-code">{{ inv.number }}</span>
          </td>
        </ng-container>

        <!-- Data -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef> Emissão </th>
          <td mat-cell *matCellDef="let inv"> 
            {{ inv.createdAt | date:'dd/MM/yyyy HH:mm' }} 
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let inv">
            <span class="il-status" [class.il-status--aberta]="inv.status === 'Aberta'" [class.il-status--fechada]="inv.status === 'Fechada'">
              {{ inv.status }}
            </span>
          </td>
        </ng-container>

        <!-- Ações -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Ações </th>
          <td mat-cell *matCellDef="let inv">
            <div class="il-actions">
              
              <!-- Botão Imprimir -->
              <button class="il-btn il-btn--primary il-btn--small" 
                      (click)="printInvoice(inv)"
                      [disabled]="inv.status === 'Fechada' || loading">
                <mat-icon>print</mat-icon>
                {{ inv.status === 'Fechada' ? 'Impresso' : 'Imprimir' }}
              </button>
              
           <!-- Botão Excluir: LIXEIRA moderna (estilo Flaticon) 🔴 -->
<button class="il-btn il-btn--danger il-btn--icon" 
        (click)="deleteInvoice(inv)"
        *ngIf="inv.status === 'Aberta'"
        title="Excluir nota">
  <mat-icon>delete</mat-icon>
</button>
              
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Estado Vazio -->
    <div *ngIf="!loading && dataSource.data.length === 0" class="il-empty">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" class="il-empty__icon">
        <path d="M5 3h7.586L17 7.414V17a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <path d="M12 3v5h5M19 23H9M19 29H9M19 35h-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="il-empty__text">Nenhuma nota fiscal cadastrada ainda.</p>
      <button class="il-btn il-btn--primary" routerLink="/invoices/new">
        Criar primeira NF
      </button>
    </div>

  </div>
</div>
