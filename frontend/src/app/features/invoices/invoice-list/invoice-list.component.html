<div class="korp-notes-page">
  <main>
    <div class="container">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-head-left">
            <div class="panel-icon">
              <mat-icon>receipt_long</mat-icon>
            </div>
            <div>
              <h1>Notas Fiscais</h1>
              <p>Crie e acompanhe o status das emissões</p>
            </div>
          </div>

          <button class="btn-primary" type="button" (click)="goToCreate()">
            <mat-icon>add</mat-icon>
            Nova NF
          </button>
        </div>

        <div *ngIf="error" class="empty-state" role="alert">
          <mat-icon>error_outline</mat-icon>
          <div class="state-message">{{ error }}</div>
          <div class="state-action">
            <button class="btn-primary" (click)="loadInvoices()">Tentar novamente</button>
          </div>
        </div>

        <div *ngIf="loading" class="empty-state">
          <mat-icon>hourglass_top</mat-icon>
          <div class="state-message">Carregando notas fiscais...</div>
        </div>

        <div class="table-wrap" *ngIf="!loading && dataSource.data.length > 0">
          <table>
            <thead>
              <tr>
                <th>Número</th>
                <th>Emissão</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let inv of dataSource.data">
                <td><span class="code-badge">{{ inv.number }}</span></td>
                <td class="date-cell">{{ inv.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
                <td>
                  <span class="status-badge"
                        [class.open]="inv.status === invoiceStatus.open"
                        [class.closed]="inv.status === invoiceStatus.closed">
                    {{ inv.status }}
                  </span>
                </td>
                <td>
                  <div class="actions">
                    <button class="btn-print" (click)="printInvoice(inv)" [disabled]="inv.status === invoiceStatus.closed || processingInvoiceIds.has(inv.id)">
                      <mat-icon>print</mat-icon>
                      <span class="print-label">{{ inv.status === invoiceStatus.closed ? 'Impresso' : processingInvoiceIds.has(inv.id) ? 'Processando...' : 'Imprimir' }}</span>
                    </button>

                    <button class="icon-btn danger" (click)="deleteInvoice(inv)" *ngIf="inv.status === invoiceStatus.open" title="Excluir nota">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div *ngIf="!loading && dataSource.data.length === 0" class="empty-state">
          <mat-icon>receipt_long</mat-icon>
          <p class="state-action">Nenhuma nota fiscal cadastrada.</p>
          <div class="state-action--spacious">
            <button class="btn-primary" type="button" (click)="goToCreate()">Criar primeira NF</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
