<main class="korp-notes-page">
  <div class="container">

    <!-- Header -->
    <div class="nf-header">
    <div class="nf-header__icon">
      <mat-icon>receipt_long</mat-icon>
    </div>
    <div class="nf-header__text">
      <h1 class="nf-header__title">Nova Nota Fiscal</h1>
      <p class="nf-header__subtitle">Adicione os produtos que compõem esta nota</p>
    </div>
  </div>

    <!-- Card principal -->
    <div class="panel nf-card">

    <!-- Loading overlay de produtos -->
    <div class="nf-loading-bar" *ngIf="loadingProducts">
      <div class="nf-loading-bar__track">
        <div class="nf-loading-bar__fill"></div>
      </div>
      <span class="nf-loading-bar__label">Carregando produtos...</span>
    </div>

    <form [formGroup]="invoiceForm" autocomplete="off">

      <!-- Tabela de itens -->
      <div class="nf-items-section">
        <div class="nf-items-header">
          <span class="nf-items-header__label">Itens da Nota</span>
          <span class="nf-items-header__count">{{ items.length }} {{ items.length === 1 ? 'item' : 'itens' }}</span>
        </div>

        <div class="nf-items-list" formArrayName="items">

          <div
            *ngFor="let item of items.controls; let i = index"
            [formGroupName]="i"
            class="nf-item"
            [class.nf-item--invalid]="item.invalid && item.touched">

            <!-- Índice -->
            <div class="nf-item__index">
              <span>{{ i + 1 }}</span>
            </div>

            <!-- Campos -->
            <div class="nf-item__fields">

              <!-- Produto -->
              <div class="nf-field nf-field--product">
                <label class="nf-field__label" [class.nf-field__label--error]="item.get('productId')?.invalid && item.get('productId')?.touched">
                  Produto
                  <span class="nf-field__required">*</span>
                </label>
                <div class="nf-select-wrapper" [class.nf-select-wrapper--disabled]="loadingProducts" [class.nf-select-wrapper--error]="item.get('productId')?.invalid && item.get('productId')?.touched">
                  <select
                    class="nf-select"
                    formControlName="productId"
                    [disabled]="loadingProducts">
                    <option value="" disabled selected>{{ loadingProducts ? 'Carregando...' : 'Selecione um produto' }}</option>
                    <option *ngFor="let p of products" [value]="p.id">
                      {{ p.code }} — {{ p.description }} ({{ p.stockBalance }} em estoque)
                    </option>
                  </select>
                  <mat-icon class="nf-select-wrapper__chevron">expand_more</mat-icon>
                </div>
                <span class="nf-field__error" *ngIf="item.get('productId')?.hasError('required') && item.get('productId')?.touched">
                  Selecione um produto
                </span>
              </div>

              <!-- Quantidade -->
              <div class="nf-field nf-field--qty">
                <label class="nf-field__label" [class.nf-field__label--error]="item.get('quantity')?.invalid && item.get('quantity')?.touched">
                  Quantidade
                  <span class="nf-field__required">*</span>
                </label>
                <div class="qty-control">
                  <button type="button" class="qty-btn" (click)="decreaseQty(i)" aria-label="Diminuir">-</button>
                  <input
                    class="nf-input qty-input"
                    [class.nf-input--error]="item.get('quantity')?.invalid && item.get('quantity')?.touched"
                    type="text"
                    [value]="item.get('quantity')?.value"
                    (input)="onQuantityInput($event, i)"
                    (keydown)="onlyInteger($event)"
                    placeholder="1">
                  <button type="button" class="qty-btn" (click)="increaseQty(i)" aria-label="Aumentar">+</button>
                </div>
                <span class="nf-field__error" *ngIf="item.get('quantity')?.hasError('required') && item.get('quantity')?.touched">
                  Obrigatório
                </span>
                <span class="nf-field__error" *ngIf="item.get('quantity')?.hasError('min') && item.get('quantity')?.touched">
                  Mínimo: 1
                </span>
              </div>

            </div>

            <!-- Remover -->
            <button
              class="nf-item__remove"
              type="button"
              (click)="removeItem(i)"
              [disabled]="items.length === 1"
              [title]="items.length === 1 ? 'Mínimo de 1 item' : 'Remover item'"
              aria-label="Remover item">
              <mat-icon>close</mat-icon>
            </button>

          </div>

        </div>

        <!-- Botão adicionar -->
        <button
          class="nf-btn-add"
          type="button"
          (click)="addItem()"
          [disabled]="loading || loadingProducts">
          <mat-icon>add</mat-icon>
          Adicionar produto
        </button>

      </div>

      <!-- Rodapé do formulário -->
      <div class="nf-form-footer">
        <button
          class="nf-btn nf-btn--ghost"
          type="button"
          (click)="onCancel()"
          [disabled]="loading">
          Cancelar
        </button>

        <button
          class="nf-btn nf-btn--primary"
          type="button"
          (click)="onSubmit()"
          [disabled]="invoiceForm.invalid || loading || loadingProducts">
          <span class="nf-btn__spinner" *ngIf="loading"></span>
          <mat-icon *ngIf="!loading">check</mat-icon>
          {{ loading ? 'Criando nota...' : 'Criar Nota Fiscal' }}
        </button>
      </div>

    </form>
    </div>
  </div>
</main>
